name: Stock AI Quant Daily

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Packages
        run: pip install -r requirements.txt

      - name: Run ETF Rotation
        run: python strategy/real_etf_rotation.py

      - name: Run Daily Report
        run: python strategy/daily_report.py
