name: Stock AI Pro Live

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python strategy/live_data.py
      - run: python strategy/live_etf_rotation.py
      - run: python strategy/position_control.py
      - run: python strategy/rebalance.py
      - run: python strategy/risk_alert.py
      - run: python strategy/dashboard.py
