name: Stock AI Profit Boost

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python strategy/live_etf_rotation.py
      - run: python strategy/hot_sector.py
      - run: python strategy/top5_opportunity.py
      - run: python strategy/position_control.py
      - run: python strategy/profit_guard.py
      - run: python strategy/performance.py
