name: Stock AI Live Trading

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Packages
        run: pip install -r requirements.txt

      - name: ETF Rotation
        run: python strategy/live_etf_rotation.py

      - name: Position Control
        run: python strategy/position_control.py

      - name: Trade Plan
        run: python strategy/trade_plan.py
